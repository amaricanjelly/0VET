<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PulseNotify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    /* ── Design Tokens ─────────────────────────────────── */
    :root {
      --bg:          #0a0c0f;
      --surface:     #111418;
      --surface2:    #181c22;
      --border:      #242930;
      --accent:      #00e5ff;
      --accent-dim:  #00e5ff22;
      --accent2:     #ff6b35;
      --ok:          #00e676;
      --warn:        #ffab40;
      --err:         #ff5252;
      --text:        #e8ecf0;
      --text-muted:  #6b7480;
      --text-dim:    #3a4048;
      --mono:        'JetBrains Mono', monospace;
      --sans:        'Syne', sans-serif;
      --radius:      10px;
      --fab-size:    56px;
    }

    /* ── Reset ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%; width: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      overflow: hidden;
    }

    /* ── Layout ────────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 600px;
      margin: 0 auto;
      position: relative;
    }

    /* ── Header ────────────────────────────────────────── */
    header {
      padding: 20px 20px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .app-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), #0088aa);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 16px var(--accent-dim);
    }
    .app-name {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
    }
    .app-name span { color: var(--accent); }
    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--text-dim);
      transition: background 0.4s, box-shadow 0.4s;
    }
    .status-dot.live {
      background: var(--ok);
      box-shadow: 0 0 8px var(--ok);
      animation: pulse-dot 2s infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    /* ── Topic Chips ───────────────────────────────────── */
    .topic-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      min-height: 28px;
    }
    .topic-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px 4px 8px;
      background: var(--accent-dim);
      border: 1px solid #00e5ff44;
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      user-select: none;
    }
    .topic-chip:hover { background: #00e5ff33; transform: translateY(-1px); }
    .topic-chip.active { background: #00e5ff22; border-color: var(--accent); }
    .chip-remove {
      font-size: 14px;
      line-height: 1;
      opacity: 0.5;
      transition: opacity 0.2s;
    }
    .chip-remove:hover { opacity: 1; }
    .topic-empty {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dim);
      align-self: center;
    }

    /* ── Feed ──────────────────────────────────────────── */
    #feed {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 80px;
      scroll-behavior: smooth;
    }
    #feed::-webkit-scrollbar { width: 4px; }
    #feed::-webkit-scrollbar-track { background: transparent; }
    #feed::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 12px;
      opacity: 0.4;
      pointer-events: none;
      user-select: none;
    }
    .empty-icon { font-size: 48px; }
    .empty-label {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.6;
    }

    /* ── Notification Card ─────────────────────────────── */
    .notif-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 8px;
      position: relative;
      overflow: hidden;
      animation: slide-in 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-8px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0)   scale(1);    }
    }
    .notif-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--accent);
      border-radius: 3px 0 0 3px;
    }
    .notif-card.priority-urgent::before { background: var(--err); }
    .notif-card.priority-high::before   { background: var(--warn); }
    .notif-card.priority-low::before    { background: var(--text-dim); }
    .notif-card.type-test::before       { background: var(--accent2); }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .card-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .card-topic {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--accent);
      background: var(--accent-dim);
      padding: 2px 7px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }
    .card-badge {
      font-family: var(--mono);
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-urgent  { background: #ff525222; color: var(--err);  border: 1px solid #ff525244; }
    .badge-high    { background: #ffab4022; color: var(--warn); border: 1px solid #ffab4044; }
    .badge-default { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
    .badge-test    { background: #ff6b3522; color: var(--accent2); border: 1px solid #ff6b3544; }

    .card-time {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-dim);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
      line-height: 1.4;
    }
    .card-body {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
      word-break: break-word;
    }

    /* ── FAB ───────────────────────────────────────────── */
    #fab {
      position: fixed;
      bottom: 108px;
      right: calc(50% - 300px + 16px);
      width: var(--fab-size);
      height: var(--fab-size);
      background: linear-gradient(135deg, var(--accent), #0099bb);
      border: none;
      border-radius: 50%;
      color: #000;
      font-size: 26px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px #00e5ff44;
      transition: transform 0.2s, box-shadow 0.2s;
      z-index: 20;
    }
    #fab:hover  { transform: scale(1.08); box-shadow: 0 6px 28px #00e5ff66; }
    #fab:active { transform: scale(0.96); }
    @media (max-width: 600px) {
      #fab { right: 16px; }
    }

    /* ── Hardware Emulator Panel ───────────────────────── */
    #emulator {
      flex-shrink: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px 16px 14px;
      z-index: 10;
    }
    .emu-label {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 9px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .emu-label::before {
      content: '';
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--accent2);
      box-shadow: 0 0 6px var(--accent2);
    }
    .emu-buttons {
      display: flex;
      gap: 10px;
    }
    .emu-btn {
      flex: 1;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface2);
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
      user-select: none;
    }
    .emu-btn:active { transform: scale(0.97); }
    .emu-btn.alert  { border-color: #ff6b3544; }
    .emu-btn.alert:hover  { background: #ff6b3522; border-color: var(--accent2); color: var(--accent2); }
    .emu-btn.clear  { border-color: #ff525244; }
    .emu-btn.clear:hover  { background: #ff525222; border-color: var(--err); color: var(--err); }

    /* ── Modal / Overlay ───────────────────────────────── */
    #overlay {
      position: fixed; inset: 0;
      background: #000000cc;
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    #overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      padding: 24px 20px 32px;
      width: 100%;
      max-width: 600px;
      animation: modal-up 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes modal-up {
      from { transform: translateY(40px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    .modal-handle {
      width: 36px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 20px;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .modal-sub {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 18px;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }
    .modal-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .modal-input:focus { border-color: var(--accent); }
    .modal-input::placeholder { color: var(--text-dim); }
    .modal-hint {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-dim);
      margin-bottom: 18px;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
    }
    .btn-primary {
      flex: 1;
      padding: 12px;
      background: linear-gradient(135deg, var(--accent), #0099bb);
      border: none;
      border-radius: var(--radius);
      color: #000;
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }
    .btn-primary:hover  { opacity: 0.9; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-ghost {
      padding: 12px 18px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-muted);
      font-family: var(--sans);
      font-size: 14px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-ghost:hover { border-color: var(--text-muted); color: var(--text); }

    /* ── Toast ─────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 180px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 18px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-muted);
      z-index: 200;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
<div id="app">

  <!-- ── Header ─────────────────────────────────────── -->
  <header>
    <div class="header-top">
      <div class="app-logo">
        <div class="logo-icon">📡</div>
        <div class="app-name">Pulse<span>Notify</span></div>
      </div>
      <div class="status-pill">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">IDLE</span>
      </div>
    </div>
    <div class="topic-row" id="topicRow">
      <span class="topic-empty" id="topicEmpty">No topics subscribed</span>
    </div>
  </header>

  <!-- ── Feed ───────────────────────────────────────── -->
  <div id="feed">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🔕</div>
      <div class="empty-label">No notifications yet.<br>Subscribe to a topic or trigger a test alert.</div>
    </div>
  </div>

  <!-- ── FAB ────────────────────────────────────────── -->
  <button id="fab" title="Subscribe to topic">+</button>

  <!-- ── Hardware Emulator ──────────────────────────── -->
  <div id="emulator">
    <div class="emu-label">Hardware Emulator</div>
    <div class="emu-buttons">
      <button class="emu-btn alert" onclick="App.triggerTestAlert()">⚡ Test Alert</button>
      <button class="emu-btn clear"  onclick="App.clearLogs()">🗑 Clear Logs</button>
    </div>
  </div>
</div>

<!-- ── Subscribe Modal ────────────────────────────── -->
<div id="overlay">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Subscribe to Topic</div>
    <div class="modal-sub">ntfy.sh / <span style="color:var(--accent)">your-topic</span></div>
    <div class="input-group">
      <input class="modal-input" id="topicInput" type="text"
             placeholder="e.g. my-alerts-42" autocomplete="off"
             autocorrect="off" autocapitalize="none" spellcheck="false" />
    </div>
    <div class="modal-hint">Topic names are case-sensitive. Avoid common words to reduce accidental messages.</div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="App.closeModal()">Cancel</button>
      <button class="btn-primary" onclick="App.subscribe()">Subscribe</button>
    </div>
  </div>
</div>

<!-- ── Toast ──────────────────────────────────────── -->
<div id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════
   PulseNotify — Core Application
═══════════════════════════════════════════════════════ */
const App = (() => {

  /* ── State ─────────────────────────────────────────── */
  const state = {
    topics:      JSON.parse(localStorage.getItem('pn_topics') || '[]'),
    connections: {},   // topic -> EventSource
    logs:        [],
  };

  /* ── DOM refs ──────────────────────────────────────── */
  const $ = id => document.getElementById(id);
  const feed       = $('feed');
  const emptyState = $('emptyState');
  const topicRow   = $('topicRow');
  const topicEmpty = $('topicEmpty');
  const statusDot  = $('statusDot');
  const statusText = $('statusText');
  const overlay    = $('overlay');
  const topicInput = $('topicInput');
  const toastEl    = $('toast');

  /* ── Toast ─────────────────────────────────────────── */
  let toastTimer;
  function toast(msg, dur = 2400) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), dur);
  }

  /* ── Notification Permission ───────────────────────── */
  function requestPermission() {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'default') {
      Notification.requestPermission();
    }
  }

  function sendNativeNotification(title, body, topic) {
    if (typeof cordova !== 'undefined' && cordova.plugins && cordova.plugins.notification) {
      // Apache Cordova Local Notifications plugin
      cordova.plugins.notification.local.schedule({
        title: title,
        text:  body,
        foreground: true,
        icon: 'res://notification_icon',
      });
      return;
    }
    // Web Notifications fallback
    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification(title, { body, icon: '📡', tag: topic });
    }
  }

  /* ── Status bar ────────────────────────────────────── */
  function updateStatus() {
    const count = Object.keys(state.connections).length;
    if (count === 0) {
      statusDot.className  = 'status-dot';
      statusText.textContent = 'IDLE';
    } else {
      statusDot.className  = 'status-dot live';
      statusText.textContent = `LIVE ×${count}`;
    }
  }

  /* ── Topic chips ───────────────────────────────────── */
  function renderTopics() {
    topicRow.innerHTML = '';
    if (state.topics.length === 0) {
      topicRow.appendChild(topicEmpty);
      topicEmpty.style.display = '';
      return;
    }
    state.topics.forEach(t => {
      const chip = document.createElement('div');
      chip.className = 'topic-chip' + (state.connections[t] ? ' active' : '');
      chip.innerHTML = `# ${t} <span class="chip-remove" data-topic="${t}" title="Unsubscribe">×</span>`;
      chip.querySelector('.chip-remove').addEventListener('click', e => {
        e.stopPropagation();
        unsubscribe(e.target.dataset.topic);
      });
      topicRow.appendChild(chip);
    });
  }

  /* ── Subscribe / SSE ───────────────────────────────── */
  function subscribeAll() {
    state.topics.forEach(t => connectSSE(t));
  }

  function connectSSE(topic) {
    if (state.connections[topic]) return;

    const url = `https://ntfy.sh/${encodeURIComponent(topic)}/sse`;
    const es  = new EventSource(url);

    es.addEventListener('message', e => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.event === 'message') {
          addCard({
            topic,
            title:    msg.title    || `📨 ${topic}`,
            body:     msg.message  || '',
            priority: msg.priority || 3,
            time:     new Date(msg.time * 1000),
            type:     'live',
          });
          sendNativeNotification(msg.title || topic, msg.message || '', topic);
        }
      } catch { /* skip keepalive/open events */ }
    });

    es.onerror = () => {
      // auto-reconnects by browser; just flag visually
      updateStatus();
    };

    es.onopen = () => updateStatus();

    state.connections[topic] = es;
    updateStatus();
    renderTopics();
  }

  function unsubscribe(topic) {
    if (state.connections[topic]) {
      state.connections[topic].close();
      delete state.connections[topic];
    }
    state.topics = state.topics.filter(t => t !== topic);
    localStorage.setItem('pn_topics', JSON.stringify(state.topics));
    renderTopics();
    updateStatus();
    toast(`Unsubscribed from #${topic}`);
  }

  /* ── Card rendering ────────────────────────────────── */
  const PRIORITY_MAP = {
    5: { label: 'URGENT', cls: 'priority-urgent badge-urgent' },
    4: { label: 'HIGH',   cls: 'priority-high   badge-high'   },
    3: { label: 'DEFAULT', cls: '',              bcls: 'badge-default' },
    2: { label: 'LOW',    cls: 'priority-low',   bcls: 'badge-default' },
    1: { label: 'MIN',    cls: 'priority-low',   bcls: 'badge-default' },
  };

  function addCard({ topic, title, body, priority = 3, time = new Date(), type = 'live' }) {
    emptyState.style.display = 'none';

    const pinfo  = PRIORITY_MAP[priority] || PRIORITY_MAP[3];
    const isTest = (type === 'test');
    const hh     = String(time.getHours()).padStart(2, '0');
    const mm     = String(time.getMinutes()).padStart(2, '0');
    const ss     = String(time.getSeconds()).padStart(2, '0');

    const card = document.createElement('div');
    card.className = `notif-card ${pinfo.cls || ''} ${isTest ? 'type-test' : ''}`;
    card.innerHTML = `
      <div class="card-header">
        <div class="card-meta">
          <span class="card-topic">#${topic}</span>
          <span class="card-badge ${isTest ? 'badge-test' : (pinfo.bcls || pinfo.cls.split(' ')[1] || 'badge-default')}">
            ${isTest ? 'TEST' : pinfo.label}
          </span>
        </div>
        <span class="card-time">${hh}:${mm}:${ss}</span>
      </div>
      <div class="card-title">${escHtml(title)}</div>
      ${body ? `<div class="card-body">${escHtml(body)}</div>` : ''}
    `;

    // Prepend so newest is on top
    const firstCard = feed.querySelector('.notif-card');
    if (firstCard) feed.insertBefore(card, firstCard);
    else feed.appendChild(card);

    state.logs.push({ topic, title, body, priority, time, type });
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* ── Modal ─────────────────────────────────────────── */
  function openModal() {
    overlay.classList.add('open');
    setTimeout(() => topicInput.focus(), 300);
  }

  function closeModal() {
    overlay.classList.remove('open');
    topicInput.value = '';
  }

  function subscribe() {
    const raw   = topicInput.value.trim().toLowerCase().replace(/[^a-z0-9_\-]/g, '');
    if (!raw) { toast('⚠ Enter a valid topic name'); return; }
    if (state.topics.includes(raw)) { toast('Already subscribed'); closeModal(); return; }

    state.topics.push(raw);
    localStorage.setItem('pn_topics', JSON.stringify(state.topics));
    connectSSE(raw);
    renderTopics();
    closeModal();
    toast(`✓ Subscribed to #${raw}`);
  }

  /* ── Test Alert ────────────────────────────────────── */
  function triggerTestAlert() {
    const activeTopic = state.topics[0] || 'test-channel';
    const alerts = [
      { title: '🌡 Temperature Alert', body: 'Sensor reading: 87°C — threshold exceeded on Node-3.' },
      { title: '🔋 Battery Warning',   body: 'Device BATT-07 at 12%. Charging recommended.' },
      { title: '🚨 Motion Detected',   body: 'PIR sensor triggered at Zone B, Entry Point 2.' },
      { title: '📶 Signal Lost',        body: 'Connection to remote unit HW-221 timed out.' },
      { title: '✅ System OK',          body: 'Health check passed. All nodes nominal.' },
    ];
    const pick = alerts[Math.floor(Math.random() * alerts.length)];
    addCard({ topic: activeTopic, title: pick.title, body: pick.body, priority: 3, time: new Date(), type: 'test' });
    sendNativeNotification(pick.title, pick.body, activeTopic);
    toast('⚡ Test alert fired');
  }

  /* ── Clear Logs ────────────────────────────────────── */
  function clearLogs() {
    feed.innerHTML = '';
    feed.appendChild(emptyState);
    emptyState.style.display = '';
    state.logs = [];
    toast('🗑 Logs cleared');
  }

  /* ── Keyboard shortcuts ────────────────────────────── */
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'Enter' && overlay.classList.contains('open')) subscribe();
  });

  /* ── FAB & overlay ─────────────────────────────────── */
  $('fab').addEventListener('click', openModal);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

  /* ── Cordova device ready ──────────────────────────── */
  function init() {
    requestPermission();
    renderTopics();
    subscribeAll();
  }

  if (typeof cordova !== 'undefined') {
    document.addEventListener('deviceready', init, false);
  } else {
    // Browser / dev mode
    document.addEventListener('DOMContentLoaded', init);
  }

  /* ── Public API ────────────────────────────────────── */
  return { openModal, closeModal, subscribe, triggerTestAlert, clearLogs };

})();
</script>
</body>
</html>
