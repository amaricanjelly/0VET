<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Xutiya Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Space+Mono:wght@400;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg0:     #1a0014;
  --glass:   rgba(40, 6, 34, 0.84);
  --border:  rgba(255, 155, 210, 0.14);
  --bordhi:  rgba(255, 155, 210, 0.46);
  --neon:    #ff8ecb;
  --neon2:   #ffb3e0;
  --neon3:   #ff3fa0;
  --white:   #fff2f9;
  --dim:     rgba(255, 200, 235, 0.46);
  --btn-num: rgba(50, 8, 42, 0.82);
  --btn-op:  rgba(64, 6, 52, 0.90);
  --btn-cl:  rgba(58, 4, 30, 0.92);
  --rsm:     12px;
}

html, body {
  height: 100%;
  background: var(--bg0);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Rajdhani', sans-serif;
  overflow: hidden;
}

/* Pink ambient blobs */
body::before, body::after {
  content: ''; position: fixed; border-radius: 50%;
  pointer-events: none; filter: blur(110px); opacity: .55; z-index: 0;
}
body::before {
  width: 560px; height: 560px;
  background: radial-gradient(circle, rgba(255,60,180,.20) 0%, transparent 70%);
  top: -150px; left: -150px;
}
body::after {
  width: 440px; height: 440px;
  background: radial-gradient(circle, rgba(255,150,210,.15) 0%, transparent 70%);
  bottom: -120px; right: -120px;
}

/* Scanlines */
.scanlines {
  position: fixed; inset: 0;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 3px,
    rgba(0,0,0,.05) 3px, rgba(0,0,0,.05) 4px
  );
  pointer-events: none; z-index: 1;
}

/* ── Floating funny background words ──────────────────────── */
.bg-words {
  position: fixed; inset: 0; z-index: 2;
  pointer-events: none; overflow: hidden;
}
.bg-words span {
  position: absolute;
  font-family: 'Space Mono', monospace;
  font-weight: 700;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: rgba(255, 120, 195, 0.09);
  white-space: nowrap;
  animation: floatUp linear infinite;
}
.bg-words span:nth-child(1)  { left:2%;  font-size:11px; animation-duration:20s; animation-delay:0s;    }
.bg-words span:nth-child(2)  { left:12%; font-size:14px; animation-duration:24s; animation-delay:-6s;   }
.bg-words span:nth-child(3)  { left:22%; font-size:9px;  animation-duration:17s; animation-delay:-2s;   }
.bg-words span:nth-child(4)  { left:33%; font-size:13px; animation-duration:26s; animation-delay:-9s;   }
.bg-words span:nth-child(5)  { left:44%; font-size:10px; animation-duration:19s; animation-delay:-1s;   }
.bg-words span:nth-child(6)  { left:55%; font-size:12px; animation-duration:22s; animation-delay:-7s;   }
.bg-words span:nth-child(7)  { left:64%; font-size:14px; animation-duration:18s; animation-delay:-4s;   }
.bg-words span:nth-child(8)  { left:75%; font-size:9px;  animation-duration:25s; animation-delay:-10s;  }
.bg-words span:nth-child(9)  { left:85%; font-size:11px; animation-duration:21s; animation-delay:-5s;   }
.bg-words span:nth-child(10) { left:92%; font-size:10px; animation-duration:16s; animation-delay:-8s;   }
.bg-words span:nth-child(11) { left:7%;  font-size:12px; animation-duration:28s; animation-delay:-13s;  }
.bg-words span:nth-child(12) { left:48%; font-size:9px;  animation-duration:23s; animation-delay:-15s;  }

@keyframes floatUp {
  from { transform: translateY(110vh); opacity: 0; }
  8%   { opacity: 1; }
  92%  { opacity: 1; }
  to   { transform: translateY(-12vh); opacity: 0; }
}

/* ── Wrapper & Shell ───────────────────────────────────────── */
.wrap {
  position: relative; z-index: 10;
  width: min(378px, 95vw); padding: 12px;
}

.shell {
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: 28px;
  backdrop-filter: blur(44px) saturate(170%);
  -webkit-backdrop-filter: blur(44px) saturate(170%);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.04) inset,
    0 40px 100px rgba(0,0,0,.78),
    0 0 90px rgba(255,60,180,.06);
  overflow: hidden;
}

@keyframes shake {
  0%,100%{ transform:translateX(0) }
  15%    { transform:translateX(-7px) rotate(-.8deg) }
  30%    { transform:translateX(7px)  rotate(.8deg)  }
  45%    { transform:translateX(-5px) }
  60%    { transform:translateX(5px)  }
  75%    { transform:translateX(-3px) }
  88%    { transform:translateX(2px)  }
}
.shell.shake { animation: shake .5s cubic-bezier(.36,.07,.19,.97) both; }

/* ── Top bar ───────────────────────────────────────────────── */
.topbar {
  display: flex; align-items: center; justify-content: center;
  padding: 16px 20px 10px;
  border-bottom: 1px solid var(--border);
}
.brand {
  font-family: 'Orbitron', monospace;
  font-size: 11px; font-weight: 800;
  letter-spacing: .22em; text-transform: uppercase;
  color: var(--neon);
  text-shadow: 0 0 18px rgba(255,142,203,.80);
}

/* ── Display ───────────────────────────────────────────────── */
.display {
  padding: 14px 20px 12px;
  min-height: 128px;
  display: flex; flex-direction: column; justify-content: flex-end;
  position: relative;
  background: linear-gradient(175deg, rgba(0,0,0,.16) 0%, rgba(0,0,0,.30) 100%);
  border-bottom: 1px solid var(--border);
}

.sys-msg {
  font-family: 'Space Mono', monospace;
  font-size: 9px; letter-spacing: .09em;
  color: var(--neon2);
  text-shadow: 0 0 8px rgba(255,179,224,.65);
  min-height: 14px; opacity: 0; transition: opacity .3s;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sys-msg.show { opacity: 1; }

.expr {
  font-family: 'Space Mono', monospace;
  font-size: 13px; color: var(--dim);
  text-align: right; min-height: 18px; margin: 4px 0 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.number {
  font-family: 'Space Mono', monospace;
  font-size: 52px; font-weight: 700;
  color: var(--white); text-align: right;
  line-height: 1; min-height: 58px;
  letter-spacing: -.02em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  text-shadow: 0 0 28px rgba(255,142,203,.30);
  transition: font-size .15s;
}
.number.md { font-size: 34px; }
.number.sm { font-size: 22px; letter-spacing: 0; }

@keyframes glitch {
  0%,100%{ clip-path:none; transform:none; color:var(--white) }
  12%    { clip-path:polygon(0 25%,100% 25%,100% 55%,0 55%); transform:translate(-3px,0); color:var(--neon3) }
  24%    { clip-path:polygon(0 60%,100% 60%,100% 80%,0 80%); transform:translate(3px,0);  color:var(--neon)  }
  36%    { clip-path:none; transform:none; color:var(--white) }
  48%    { clip-path:polygon(0 8%,100% 8%,100% 35%,0 35%);   transform:translate(2px,-1px); color:var(--neon2) }
  60%    { clip-path:none; transform:none; color:var(--white) }
}
.number.glitch { animation: glitch .42s steps(1) both; }

.cursor {
  display: inline-block; width: 3px; height: .85em;
  background: var(--neon); margin-left: 3px; vertical-align: middle;
  animation: blink .75s step-end infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* ── Loading overlay ───────────────────────────────────────── */
.overlay {
  position: absolute; inset: 0;
  background: rgba(20,2,18,.90);
  backdrop-filter: blur(6px);
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 11px; z-index: 20;
}
.overlay.on { display: flex; }

.spinner {
  width: 34px; height: 34px;
  border: 2px solid var(--border);
  border-top-color: var(--neon);
  border-radius: 50%;
  animation: spin .65s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg) } }

.spin-label {
  font-family: 'Space Mono', monospace;
  font-size: 10px; color: var(--neon); letter-spacing: .12em;
  animation: flicker 1.1s ease-in-out infinite;
}
@keyframes flicker { 0%,100%{opacity:1} 55%{opacity:.45} }

.dots span {
  display: inline-block; width: 5px; height: 5px;
  border-radius: 50%; background: var(--neon2); margin: 0 3px;
  animation: db .85s ease-in-out infinite;
}
.dots span:nth-child(2){ animation-delay:.14s }
.dots span:nth-child(3){ animation-delay:.28s }
@keyframes db { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

/* ── Button grid ───────────────────────────────────────────── */
.grid {
  display: grid; grid-template-columns: repeat(4,1fr);
  gap: 9px; padding: 13px 14px 16px;
}

.btn {
  position: relative; display: flex;
  align-items: center; justify-content: center;
  height: 64px;
  border: 1px solid var(--border);
  border-radius: var(--rsm);
  background: var(--btn-num);
  color: var(--white);
  font-family: 'Space Mono', monospace;
  font-size: 18px; cursor: pointer; outline: none;
  user-select: none; -webkit-tap-highlight-color: transparent;
  overflow: hidden;
  transition: background .14s, border-color .14s, transform .09s, box-shadow .14s;
}
.btn::after {
  content: ''; position: absolute; inset: 0;
  border-radius: inherit; background: rgba(255,255,255,.08);
  opacity: 0; transition: opacity .25s;
}
.btn:active::after { opacity: 1; transition: 0s; }
.btn:hover {
  background: rgba(84, 16, 70, .95);
  border-color: var(--bordhi);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,0,0,.42), 0 0 14px rgba(255,60,180,.09);
}
.btn:active { transform: scale(.93); }

.btn.op {
  background: var(--btn-op);
  color: var(--neon); border-color: rgba(255,142,203,.22); font-size: 22px;
}
.btn.op:hover {
  background: rgba(96, 16, 80, .97);
  border-color: rgba(255,142,203,.55);
  box-shadow: 0 6px 22px rgba(255,60,180,.18);
}

.btn.cl {
  background: var(--btn-cl); color: var(--neon);
  border-color: rgba(255,80,160,.22);
  font-family: 'Orbitron', monospace; font-size: 12px; letter-spacing: .06em;
}
.btn.cl:hover {
  background: rgba(84, 8, 46, .97);
  border-color: rgba(255,80,160,.52);
  box-shadow: 0 6px 22px rgba(255,60,150,.16);
}

.btn.eq {
  grid-column: span 2;
  background: linear-gradient(135deg, rgba(105,14,86,.97) 0%, rgba(72,8,60,.97) 100%);
  color: var(--white); border-color: rgba(255,142,203,.36);
  font-family: 'Orbitron', monospace; font-size: 16px; letter-spacing: .08em;
  box-shadow: 0 0 24px rgba(255,142,203,.14), inset 0 1px 0 rgba(255,255,255,.06);
  animation: eqPulse 3s ease-in-out infinite;
}
@keyframes eqPulse {
  0%,100%{ box-shadow: 0 0 24px rgba(255,142,203,.14), inset 0 1px 0 rgba(255,255,255,.06) }
  50%    { box-shadow: 0 0 48px rgba(255,142,203,.35), 0 0 85px rgba(255,60,180,.12), inset 0 1px 0 rgba(255,255,255,.06) }
}
.btn.eq:hover {
  background: linear-gradient(135deg, rgba(145,22,118,.99) 0%, rgba(105,14,86,.99) 100%);
  border-color: rgba(255,142,203,.70);
  box-shadow: 0 0 58px rgba(255,142,203,.44), 0 8px 28px rgba(0,0,0,.46);
  animation: none; transform: translateY(-2px);
}

.btn.span2 { grid-column: span 2; }

.footer { padding: 0 16px 10px; }

@media (max-width: 400px) {
  .btn    { height: 57px; font-size: 16px; }
  .btn.op { font-size: 20px; }
  .number { font-size: 42px; }
  .grid   { gap: 7px; padding: 10px 10px 14px; }
}
</style>
</head>
<body>
<div class="scanlines"></div>

<!-- Floating background funny words -->
<div class="bg-words">
  <span>bruh moment</span>
  <span>pookie math</span>
  <span>2+2=fish</span>
  <span>skill issue</span>
  <span>touch grass</span>
  <span>wrong answer</span>
  <span>math is hard</span>
  <span>xutiya mode</span>
  <span>no logic here</span>
  <span>certified chaos</span>
  <span>big brain off</span>
  <span>why even try</span>
</div>

<div class="wrap">
  <div class="shell" id="shell">

    <div class="overlay" id="overlay">
      <div class="spinner"></div>
      <div class="spin-label" id="spinLabel">THINKING HARD...</div>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>

    <div class="topbar">
      <div class="brand">Xutiya Calculator</div>
    </div>

    <div class="display">
      <div class="sys-msg" id="sysMsg"></div>
      <div class="expr"    id="expr"></div>
      <div class="number"  id="numDisplay">0</div>
    </div>

    <div class="grid">
      <button class="btn cl span2" onclick="clearAll()">CLR</button>
      <button class="btn op"       onclick="inputOp('%')">%</button>
      <button class="btn op"       onclick="inputOp('/')">÷</button>

      <button class="btn" onclick="inputDigit('7')">7</button>
      <button class="btn" onclick="inputDigit('8')">8</button>
      <button class="btn" onclick="inputDigit('9')">9</button>
      <button class="btn op" onclick="inputOp('*')">×</button>

      <button class="btn" onclick="inputDigit('4')">4</button>
      <button class="btn" onclick="inputDigit('5')">5</button>
      <button class="btn" onclick="inputDigit('6')">6</button>
      <button class="btn op" onclick="inputOp('-')">−</button>

      <button class="btn" onclick="inputDigit('1')">1</button>
      <button class="btn" onclick="inputDigit('2')">2</button>
      <button class="btn" onclick="inputDigit('3')">3</button>
      <button class="btn op" onclick="inputOp('+')">+</button>

      <button class="btn" onclick="inputDigit('0')">0</button>
      <button class="btn" onclick="inputDot()">.</button>
      <button class="btn eq" onclick="calculate()">=</button>
    </div>

    <div class="footer"></div>
  </div>
</div>

<script>
let current = '0', first = null, op = null;
let exprStr = '', afterCalc = false, busy = false;

function funnyCalc(a, b, operator) {
  const sa = a.toString().replace(/\.?0+$/, '') || '0';
  const sb = b.toString().replace(/\.?0+$/, '') || '0';
  if (operator === '*') {
    const t = Math.min(Math.round(Math.abs(b)), 12) || 1;
    return sa.repeat(t);
  }
  return sa + sb;
}

function setDisplay(val) {
  const el = document.getElementById('numDisplay');
  el.classList.remove('md','sm','glitch');
  const s = String(val);
  if (s.length > 10) el.classList.add('sm');
  else if (s.length > 7) el.classList.add('md');
  el.textContent = s;
}
function setExpr(s) { document.getElementById('expr').textContent = s; }
function opSym(o) { return {'+':'+','-':'−','*':'×','/':'÷','%':'%'}[o]||o; }

const sysPool = [
  'calculating nonsense...','math.exe stopped working',
  'ai confusion detected','logic not found',
  'pookie says wrong','sanity check failed',
  'bruh moment incoming','certified skill issue',
];
const spinPool = [
  'BREAKING MATH...','ASKING THE VOID...',
  'DEPLOYING CHAOS...','IGNORING LOGIC...',
  'POOKIE COMPUTING...','SUMMONING RESULT...',
];

let sysTmr = null;
function showSys(msg) {
  const el = document.getElementById('sysMsg');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(sysTmr);
  sysTmr = setTimeout(() => el.classList.remove('show'), 3000);
}
function maybeSys() {
  if (Math.random() < 0.6)
    showSys(sysPool[Math.floor(Math.random() * sysPool.length)]);
}

function shake() {
  const s = document.getElementById('shell');
  s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake');
  s.addEventListener('animationend', () => s.classList.remove('shake'), {once:true});
}

function typeIn(text, cb) {
  const el = document.getElementById('numDisplay');
  el.classList.remove('md','sm');
  const s = String(text);
  if (s.length > 10) el.classList.add('sm');
  else if (s.length > 7) el.classList.add('md');
  let i = 0;
  el.innerHTML = '<span class="cursor"></span>';
  const iv = setInterval(() => {
    i++;
    el.innerHTML = s.slice(0,i) + '<span class="cursor"></span>';
    if (i >= s.length) { clearInterval(iv); el.innerHTML = s; if(cb) cb(); }
  }, 40);
}

function inputDigit(d) {
  if (busy) return;
  if (afterCalc) { current=d; exprStr=''; op=null; first=null; afterCalc=false; }
  else current = current==='0' ? d : current+d;
  setDisplay(current);
  setExpr(exprStr + (op?opSym(op):'') + current);
}
function inputDot() {
  if (busy || current.includes('.')) return;
  current += '.'; setDisplay(current);
}
function inputOp(o) {
  if (busy) return;
  first=current; op=o; afterCalc=false;
  exprStr=current+' '+opSym(o)+' ';
  current='0'; setDisplay('0'); setExpr(exprStr);
}
function clearAll() {
  if (busy) return;
  current='0'; first=null; op=null; exprStr=''; afterCalc=false;
  setDisplay('0'); setExpr('');
  document.getElementById('sysMsg').classList.remove('show');
}

function calculate() {
  if (busy||op===null||first===null) return;
  busy = true;
  setExpr(first+' '+opSym(op)+' '+current+' =');
  const overlay = document.getElementById('overlay');
  const spinLabel = document.getElementById('spinLabel');
  spinLabel.textContent = spinPool[Math.floor(Math.random()*spinPool.length)];
  overlay.classList.add('on');
  setTimeout(() => {
    overlay.classList.remove('on');
    const result = funnyCalc(parseFloat(first), parseFloat(current), op);
    const doGlitch = Math.random() < 0.38;
    const doShake  = Math.random() < 0.55;
    maybeSys();
    if (doShake) shake();
    typeIn(result, () => {
      if (doGlitch) {
        const el = document.getElementById('numDisplay');
        el.classList.add('glitch');
        setTimeout(() => el.classList.remove('glitch'), 480);
      }
      busy = false;
    });
    afterCalc=true; op=null; first=null; current=String(result);
  }, 700 + Math.random()*900);
}

document.addEventListener('keydown', e => {
  if (e.key>='0'&&e.key<='9')          { inputDigit(e.key); return; }
  if (e.key==='.')                      { inputDot();         return; }
  if (e.key==='+')                      { inputOp('+');       return; }
  if (e.key==='-')                      { inputOp('-');       return; }
  if (e.key==='*')                      { inputOp('*');       return; }
  if (e.key==='/'){e.preventDefault();   inputOp('/');        return; }
  if (e.key==='%')                      { inputOp('%');       return; }
  if (e.key==='Enter'||e.key==='=')     { calculate();        return; }
  if (e.key==='Escape'||e.key.toLowerCase()==='c') { clearAll(); return; }
  if (e.key==='Backspace') {
    if (busy) return;
    current = current.length>1 ? current.slice(0,-1) : '0';
    setDisplay(current);
  }
});
</script>
</body>
</html>
